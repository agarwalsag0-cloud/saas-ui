<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">

<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">

<div class="absolute bottom-[-10%] left-[-5%] w-[500px] h-[500px] bg-secondary-container rounded-full blur-[100px] opacity-30"></div>

<div class="flex justify-center mb-md">

</div>
<h1 class="font-headline-sm text-headline-sm text-on-surface mb-sm">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to discover and manage your services.</p>
</div>
<!-- Primary CTA -->
<button class="w-full flex items-center justify-center gap-sm py-3 px-4 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT hover:bg-surface-container-low transition-colors duration-200 mb-lg shadow-[0px_1px_3px_rgba(0,0,0,0.1),_0px_1px_2px_rgba(0,0,0,0.06)]">

<span class="font-label-md text-label-md text-on-surface">Continue with Google</span>
</button>
<div class="flex items-center gap-md mb-lg">
<div class="h-px bg-outline-variant flex-grow"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant">or continue with email</span>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
<!-- Form -->
<form class="space-y-md">
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="email">Email Address</label>
<input class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" placeholder="you@example.com" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full py-3 px-4 bg-primary text-on-primary font-label-md text-label-md rounded-DEFAULT hover:bg-primary-container transition-colors duration-200 mt-md" type="submit">

                </button>

<p class="font-body-sm text-body-sm text-on-surface-variant">

<span class="material-symbols-outlined text-[16px]">storefront</span>
