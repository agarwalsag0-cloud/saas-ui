<!DOCTYPE html>

<html lang="en"><head>

<style>
        .custom-shadow-soft {
            box-shadow: 0px 1px 3px rgba(0,0,0,0.1), 0px 1px 2px rgba(0,0,0,0.06);
        }
        .input-focus-ring:focus-within {
            border-color: #3e32d3;
            box-shadow: 0 0 0 3px rgba(62, 50, 211, 0.1);
        }

<body class="bg-surface min-h-screen flex items-center justify-center p-lg font-body-md text-on-surface">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl custom-shadow-soft border border-outline-variant p-2xl">
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-sm text-headline-sm text-primary mb-sm">SaaSFlow</h1>
<h2 class="font-title-lg text-title-lg mb-xs">Business Portal Login</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Secure access for business owners and administrators.</p>
</div>
<!-- Login Form -->
<form class="space-y-lg">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative input-focus-ring border border-outline-variant rounded bg-surface-container-lowest transition-all duration-200">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-transparent border-none py-sm pl-[40px] pr-sm font-body-md text-body-md focus:ring-0" id="email" name="email" placeholder="admin@business.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative input-focus-ring border border-outline-variant rounded bg-surface-container-lowest transition-all duration-200">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-transparent border-none py-sm pl-[40px] pr-[40px] font-body-md text-body-md focus:ring-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-5 h-5 rounded-[4px] border-outline-variant text-primary focus:ring-primary focus:ring-2 focus:ring-offset-2" id="remember" name="remember" type="checkbox"/>
<label class="ml-sm font-body-sm text-body-sm text-on-surface-variant" for="remember">Remember me for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-md rounded hover:bg-primary-container transition-colors duration-200 flex justify-center items-center gap-xs" type="submit">
                Login to Portal
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-xl pt-lg border-t border-outline-variant text-center space-y-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                New to SaaSFlow? 
                <a class="font-label-sm text-label-sm text-primary hover:underline ml-xs" href="#">Register Business</a>
</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Looking for personal account? 
                <a class="font-label-sm text-label-sm text-secondary hover:underline ml-xs" href="#">Customer Login</a>
</p>
</div>
</div>
</body></html>
